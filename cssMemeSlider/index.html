<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeSlider</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="container">
        <section id="card-1" class="card">
            <div class="meme-gif">
                <img src="src/memes/nelza-prosto-tak-vzat-mem.jpg" alt="Нельзя просто так взять и уйти от бабушки, не покушав">
            </div>
            <div class="controls">
                <button id="control-1" class="control"></button>
                <button id="control-2" class="control"></button>
                <button id="control-3" class="control"></button>
                <button id="control-4" class="control"></button>
            </div>
            <div class="caption"><span>Нельзя просто так взять и уйти от бабушки, не покушав</span>
            </div>
        </section>
        <section id="card-2" class="card">
            <div class="meme-gif">
                <img src="src/memes/batya_vsegda_batya.jpg" alt="Я уже сам немоложой мужик, 34 года, женат, у меня трое детей, но когда я навестил отца, и он попросил меня помочь повесить светильник, он доверил мне только подержать фонарик. Батя всегда батя!">
            </div>
            <div class="controls">
                <button id="control-1" class="control"></button>
                <button id="control-2" class="control"></button>
                <button id="control-3" class="control"></button>
                <button id="control-4" class="control"></button>
            </div>
            <div class="caption"><span>Я уже сам немоложой мужик, 34 года, женат, у меня трое детей, но когда я навестил отца, и он попросил меня помочь повесить светильник, он доверил мне только подержать фонарик. Батя всегда батя!</span></div>
        </section>
        <section id="card-3" class="card">
            <div class="meme-gif">
                <img src="src/memes/davno_stoit.jpg" alt="Давно стоит">
            </div>
            <div class="controls">
                <button id="control-1" class="control"></button>
                <button id="control-2" class="control"></button>
                <button id="control-3" class="control"></button>
                <button id="control-4" class="control"></button>
            </div>
            <div class="caption"><span>Давно стоит</span></div>
        </section>
        <section id="card-4" class="card">
            <div class="meme-gif">
                <img src="src/memes/kak_vam_hurma.jpg" alt="Как вам хурма, мистер Андерсон?">
            </div>
            <div class="controls">
                <button id="control-1" class="control"></button>
                <button id="control-2" class="control"></button>
                <button id="control-3" class="control"></button>
                <button id="control-4" class="control"></button>
            </div>
            <div class="caption"><span>Как вам хурма, мистер Андерсон?</span></div>
        </section>
    </div>
</body>

</html>
